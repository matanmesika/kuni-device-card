name: Validate Kuni Device Card
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/kuni-device-card.js
      - run: node --test tests/test_kuni_card.cjs
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
